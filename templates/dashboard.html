{% extends "base.html" %}
{% block content %}
<h3 class="text-left text-4xl text-gray-800 m-10">Dashboard</h3>

<div class="max-w-6xl mx-auto p-8">
    <div class="grid grid-cols-2 grid-rows-3 gap-4 p-8">

        <!-- Item 1: Course Progress -->
        <div class="max-w-xl w-full p-6 rounded-lg shadow-xl/30">
            <h5 class="text-center text-2xl text-gray-800 m-10">Progress</h5>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-8">
                {% for name, graph in made_graphs %}
                <div class="border border-gray-300 rounded-md p-2">
                    <h5 class="text-left text-l text-gray-800 m-10">{{name}}</h5>
                    <div class="w-full h-[400px] overflow-hidden">
                        {{ graph | safe }}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>


    </div>
</div>



{% endblock %}
