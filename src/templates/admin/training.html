{% extends 'admin/master.html' %}

{% block body %}
<h2>Administrative Controls</h2>

<div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4">

        <button type="submit" class="btn btn-danger">
            Train
        </button>
    </form>
</div>
{% endblock %}
